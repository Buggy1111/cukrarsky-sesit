<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Receptury, kalkulace ceny, alergeny a výživa pro cukráře.">
<title>Cukrářský sešit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tichý luxus: slonová kost, inkoust a zlatá linka. Vysoce kontrastní antikva pro názvy a čísla, lehké bezpatkové písmo na ovládání.
   Žádné karty ani stíny, oddíly dělí jen tenká linka a vzduch. Na každé obrazovce jedno hlavní číslo: cena za kus.
   Macaron barvy (pistácie, růže) jen jako jemné akcenty. Na PC dva sloupce: vlevo složení, vpravo živá kalkulace. */
:root {
  --bg: #f8f5ef;            /* slonová kost */
  --bg-2: #f1ece3;
  --surface: #fffdf9;
  --ink: #1c1a17;           /* inkoust */
  --muted: #7b7367;
  --line: #e2d9c9;
  --gold: #a47f48;          /* zlatá linka, cena, aktivní stav */
  --gold-soft: #efe4cf;
  --pistachio: #5f8059;     /* macaron: v pořádku */
  --pistachio-soft: #e3ecdc;
  --rose: #a14a60;          /* macaron: alergeny, smazat */
  --rose-soft: #f4dde1;
  --btn: #1c1a17; --btn-ink: #fbf7ef;
  --wash: radial-gradient(700px 360px at 8% -8%, rgba(176,201,160,.28), transparent 70%), radial-gradient(640px 340px at 96% -6%, rgba(236,190,198,.30), transparent 70%);
  --font-display: "Playfair Display", "Didot", "Bodoni 72", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100e; --bg-2: #1a1714; --surface: #1d1916; --ink: #f1eadf; --muted: #a39989; --line: #322c26; --gold: #d2ae72; --gold-soft: #2c2418;
    --pistachio: #a9c9a0; --pistachio-soft: #1f2a1d; --rose: #ec96ab; --rose-soft: #35202a; --btn: #f1eadf; --btn-ink: #14110e;
    --wash: radial-gradient(700px 360px at 8% -8%, rgba(120,150,110,.16), transparent 70%), radial-gradient(640px 340px at 96% -6%, rgba(200,130,150,.15), transparent 70%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100e; --bg-2: #1a1714; --surface: #1d1916; --ink: #f1eadf; --muted: #a39989; --line: #322c26; --gold: #d2ae72; --gold-soft: #2c2418;
  --pistachio: #a9c9a0; --pistachio-soft: #1f2a1d; --rose: #ec96ab; --rose-soft: #35202a; --btn: #f1eadf; --btn-ink: #14110e;
  --wash: radial-gradient(700px 360px at 8% -8%, rgba(120,150,110,.16), transparent 70%), radial-gradient(640px 340px at 96% -6%, rgba(200,130,150,.15), transparent 70%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); background-image: var(--wash); background-repeat: no-repeat; color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 15px; line-height: 1.55; padding-inline: 20px; padding-block: 0 72px; font-variant-numeric: lining-nums tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1560px; margin-inline: auto; }
.mono { font-family: var(--font-num); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
input[type="number"] { font-family: var(--font-num); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .01em; }
:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 2px; }

/* hlavička */
.mast { position: relative; text-align: center; padding-block: 34px 18px; }
.mast .trio { display: flex; justify-content: center; gap: 0; margin-bottom: 14px; }
.mast .trio i { width: 14px; height: 14px; border-radius: 50%; margin-inline: -2px; border: 1px solid var(--bg); }
.mast .trio i:nth-child(1) { background: #b7cdae; } .mast .trio i:nth-child(2) { background: #ebc2cb; } .mast .trio i:nth-child(3) { background: #d8bd8a; }
.mast h1 { font-size: clamp(30px, 4vw, 46px); line-height: 1.05; letter-spacing: 0; font-weight: 600; }
.mast p { margin: 10px 0 0; font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
.mast .theme { position: absolute; right: 0; top: 18px; }
@media (max-width: 700px) { .mast { padding-block: 24px 14px; } .mast .theme { position: static; margin-top: 14px; } .tabs { justify-content: flex-start; gap: 22px; } }
.bar-tools { position: absolute; right: 20px; top: 0; bottom: 0; display: flex; align-items: center; gap: 16px; }
.searchbtn { border: 1px solid var(--line); background: transparent; padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.searchbtn:hover { border-color: var(--gold); color: var(--ink); }
kbd { font: 600 10.5px var(--font-body); border: 1px solid var(--line); padding: 1px 6px; color: var(--muted); }
.saved { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.saved.ok { color: var(--pistachio); }
.saved.bad { color: var(--rose); }
@media (max-width: 1100px) { .searchbtn kbd { display: none; } }
@media (max-width: 860px) { .bar-tools { position: static; justify-content: space-between; padding-bottom: 8px; } }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-inline: -20px; padding-inline: 20px; border-block: 1px solid var(--line); }
.tabs { display: flex; justify-content: center; gap: clamp(18px, 4vw, 52px); overflow-x: auto; scrollbar-width: none; max-width: 1560px; margin-inline: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 15px 2px 13px; cursor: pointer; color: var(--muted); font-weight: 400; font-size: 12.5px; letter-spacing: .24em; text-transform: uppercase; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .2s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

main { padding-block: 36px; display: grid; gap: 28px; }
.notice { font-size: 13.5px; color: var(--muted); font-style: italic; text-align: center; max-width: 760px; margin-inline: auto; }
.notice b { font-style: normal; color: var(--ink); font-weight: 500; }
.notice.warn { color: var(--rose); font-style: normal; text-align: left; border-left: 1px solid var(--rose); padding-left: 12px; max-width: none; }

/* oddíly: žádné karty, jen linka a vzduch */
.card { padding-top: 22px; border-top: 1px solid var(--line); }
.card > h3, .sec-h { font-size: 12px; font-family: var(--font-body); font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 14px; }
.card > h3::after, .spread > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.spread > h3 { font-size: 12px; font-family: var(--font-body); font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
.stack { display: grid; gap: 18px; }
.row-flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ovládání */
.btn { border: 1px solid var(--ink); background: transparent; border-radius: 0; padding: 11px 22px; cursor: pointer; font-weight: 400; font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; min-height: 42px; transition: background .2s, color .2s, border-color .2s; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn.primary:hover { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 55%, transparent); }
.btn.danger:hover { background: var(--rose); color: #fff; border-color: var(--rose); }
.btn.danger.armed { background: var(--rose); color: #fff; border-color: var(--rose); }
.btn.small { min-height: 32px; padding: 5px 14px; font-size: 11.5px; }
.btn[disabled] { opacity: .35; cursor: not-allowed; pointer-events: none; }
.icon { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 6px 10px; transition: color .2s; }
.icon:hover { color: var(--rose); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
.in, select.in, textarea.in { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--gold) 60%, var(--line)); background: color-mix(in srgb, var(--gold-soft) 62%, transparent); border-radius: 0; padding: 8px 9px; min-height: 40px; transition: border-color .2s, background .2s; }
select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 9px) 50%, calc(100% - 4px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 20px; cursor: pointer; }
textarea.in { border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); padding: 14px 16px; min-height: 180px; resize: vertical; line-height: 1.7; }
textarea.in[readonly] { background: transparent; border-color: var(--line); }
.in:hover { border-color: var(--muted); }
.in:focus { border-color: var(--gold); outline: none; }
.in.title { background: transparent; font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 4.4vw, 54px); line-height: 1.1; padding: 4px 0 8px; border-bottom-color: transparent; min-height: 0; letter-spacing: -.005em; }
.in.title:hover { border-bottom-color: var(--line); }
.in.title:focus { border-bottom-color: var(--gold); }
input[type="number"] { -moz-appearance: textfield; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); padding: 1px 9px; }
.pill.amber { color: var(--gold); }
.pill.berry { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 45%, transparent); text-transform: none; letter-spacing: .02em; font-size: 12px; }
.grid2 { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

/* seznam receptur jako obsah knihy */
.split { display: grid; gap: 34px; }
@media (min-width: 900px) { .split { grid-template-columns: 270px minmax(0, 1fr); align-items: start; gap: 56px; } .list-col { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 6px; } }
.list { display: grid; gap: 0; }
.rcard { display: grid; gap: 3px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 16px 4px 16px 14px; cursor: pointer; position: relative; transition: background .2s; }
.rcard:last-child { border-bottom: 1px solid var(--line); }
.rcard:hover { background: color-mix(in srgb, var(--gold-soft) 55%, transparent); }
.rcard[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--gold); }
.rcard[aria-current="true"] b { color: var(--gold); }
.rcard b { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.2; }
.rcard .meta { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }

/* hlavní číslo */
.sumbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 32px; padding-block: 22px 8px; }
.sumbar small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 2px; }
.sumbar strong { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; font-variant-numeric: lining-nums tabular-nums; }
.sumbar .hl { grid-column: span 2; }
.sumbar .hl strong { color: var(--gold); font-style: italic; font-size: clamp(56px, 7vw, 92px); line-height: 1; font-weight: 800; letter-spacing: -.01em; }
@media (max-width: 560px) { .sumbar .hl { grid-column: 1 / -1; } }

.subtabs { display: flex; gap: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.sub { border: 0; background: none; padding: 10px 0 12px; cursor: pointer; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; }
.sub:hover { color: var(--ink); }
.sub[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

/* editor */
.egrid { display: grid; gap: 34px; }
.col { display: grid; gap: 34px; align-content: start; min-width: 0; }
.sec { display: grid; gap: 34px; min-width: 0; }
@media (max-width: 1199px) {
  .editor:not([data-sub="compose"]) .sec[data-sec="compose"], .editor:not([data-sub="steps"]) .sec[data-sec="steps"],
  .editor:not([data-sub="calc"]) .sec[data-sec="calc"], .editor:not([data-sub="alg"]) .sec[data-sec="alg"] { display: none; }
}
@media (min-width: 1200px) {
  .editor .subtabs { display: none; }
  .egrid { grid-template-columns: minmax(0, 1.28fr) minmax(0, 1fr); align-items: start; gap: 64px; }
  .colR { position: sticky; top: 120px; }
}
.irow { display: grid; grid-template-columns: minmax(0, 1fr) 124px 40px; gap: 2px 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.irow .nums { grid-column: 1 / -1; grid-row: 2; display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.irow .nums span:empty { display: none; }
.irow .icon { grid-column: 3; grid-row: 1; }
.irow select.in { font-size: 16px; }
.irow .in { min-height: 38px; }

.qty { display: flex; align-items: center; gap: 6px; }
.qty .in { text-align: right; }
.in.need { border-bottom-color: var(--rose); background: color-mix(in srgb, var(--rose-soft) 75%, transparent); }
.in.need::placeholder { color: var(--rose); font-weight: 600; opacity: .85; }
.legend { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 34px; height: 15px; vertical-align: -3px; margin-right: 8px; }
.lg-in { background: color-mix(in srgb, var(--gold-soft) 62%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--gold) 60%, var(--line)); }
.lg-out { border-bottom: 1px dotted var(--muted); }
.lg-need { background: color-mix(in srgb, var(--rose-soft) 75%, transparent); border-bottom: 1px solid var(--rose); }
.qty .unit { color: var(--muted); font-size: 13px; font-weight: 600; width: 24px; }
@media (min-width: 720px) {
  .irow { grid-template-columns: minmax(150px, 1fr) 118px 100px 40px; gap: 0 14px; }
  .irow .nums { display: contents; }
  .irow > select { grid-column: 1; grid-row: 1; }
  .irow > .qty { grid-column: 2; grid-row: 1; }
  .irow .nums .net { display: none; }
  .irow .nums span[data-out^="gross"] { grid-column: 1; grid-row: 2; font-size: 12.5px; padding-left: 2px; }
  .irow .nums .costcell { grid-column: 3; grid-row: 1; text-align: right; color: var(--ink); font-size: 16px; font-weight: 700; font-family: var(--font-num); }
  .irow .icon { grid-column: 4; grid-row: 1; }
  .heads { display: grid; grid-template-columns: minmax(150px, 1fr) 118px 100px 40px; gap: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
  .heads span:nth-child(3) { text-align: right; } .heads span:nth-child(2) { text-align: right; padding-right: 30px; }
}
@media (max-width: 719px) { .heads { display: none; } .irow .nums span::before { content: attr(data-l) " "; opacity: .75; } }

/* kalkulace */
.tbl { width: 100%; border-collapse: collapse; }
.tbl td { padding: 13px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td:last-child { text-align: right; white-space: nowrap; font-size: 16px; font-family: var(--font-num); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
.tbl .total td { font-weight: 800; border-bottom-color: var(--ink); }
.tbl .big td { font-family: var(--font-display); font-size: 28px; font-weight: 800; color: var(--gold); border-bottom: 0; padding-block: 22px 8px; }
.tbl .big td:first-child { font-family: var(--font-body); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.tbl .param { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tbl .param .in { width: 68px; padding: 3px 2px; min-height: 32px; text-align: right; border-bottom-color: var(--muted); }
.scroll { overflow-x: auto; }
.stepbar { position: sticky; top: calc(49px + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; align-items: center; gap: 4px 22px; flex-wrap: wrap; background: color-mix(in srgb, var(--bg) 93%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 6px 0; }
.step { border: 0; background: none; display: flex; align-items: center; gap: 9px; padding: 7px 2px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; border-bottom: 1px solid transparent; }
.step:hover { color: var(--ink); }
.step[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.step .sn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; font: 700 13px/1 var(--font-display); flex: none; }
.step.done .sn { background: var(--pistachio); border-color: var(--pistachio); color: #fff; }
.sb-sum { margin-left: auto; display: flex; gap: 14px; align-items: baseline; min-width: 0; }
.sb-sum .nm { font-family: var(--font-display); font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }
.sb-sum .pr { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 23px; color: var(--gold); white-space: nowrap; }
@media (max-width: 760px) { .step .sl { display: none; } .step[aria-current="true"] .sl { display: inline; } .sb-sum .nm { display: none; } .stepbar { gap: 4px 10px; } }
.figure { padding-block: 4px; }
.figure .lab { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.figure .val { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.15; margin-top: 2px; }
.figure.gold .val { color: var(--gold); font-style: italic; font-size: 46px; font-weight: 800; }

/* alergeny */
.alg { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 0 18px; }
.chip { display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid var(--line); padding: 9px 2px; font-size: 14px; background: transparent; color: var(--muted); }
.chip b { font-family: var(--font-num); font-weight: 800; width: 22px; font-size: 14px; }
.chip.on { color: var(--ink); }
.chip.on b { color: var(--rose); }
.chip.on::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
label.chip { cursor: pointer; }
label.chip input { accent-color: var(--rose); }
.label-text { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 20px; line-height: 1.45; padding: 4px 0 4px 18px; border-left: 1px solid var(--rose); }
.label-text b { font-style: normal; font-weight: 500; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.mini-table td:not(:first-child) { font-family: var(--font-num); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
.mini-table td, .mini-table th { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.mini-table td:first-child, .mini-table th:first-child { text-align: left; }
.mini-table th { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; border-bottom-color: var(--ink); }

.nh { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0; text-transform: none; color: var(--ink); border: 1px solid var(--gold); width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 50%; margin-right: 12px; flex: none; }
.linkbtn { border: 0; background: none; color: var(--gold); cursor: pointer; padding: 4px 0; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; text-align: left; border-bottom: 1px solid transparent; }
.linkbtn:hover { border-bottom-color: var(--gold); }
.next { display: flex; justify-content: flex-end; padding-top: 4px; }

<script>
// ============================== LOGIC-START ==============================
const ALLERGENS = [
  [1, 'lepek', 'Obiloviny obsahující lepek'], [2, 'korýši', 'Korýši'], [3, 'vejce', 'Vejce'],
  [4, 'ryby', 'Ryby'], [5, 'arašídy', 'Arašídy'], [6, 'sója', 'Sója'], [7, 'mléko', 'Mléko (vč. laktózy)'],
  [8, 'ořechy', 'Skořápkové plody'], [9, 'celer', 'Celer'], [10, 'hořčice', 'Hořčice'],
  [11, 'sezam', 'Sezam'], [12, 'siřičitany', 'Oxid siřičitý a siřičitany'], [13, 'vlčí bob', 'Vlčí bob'], [14, 'měkkýši', 'Měkkýši'],
];
const BASE_UNIT = { kg: 'g', l: 'ml', ks: 'ks' };
/** Povinné výživové údaje podle nařízení EU 1169/2011 (vše na 100 g). */
const NUTR = ['kcal', 'fat', 'sat', 'carb', 'sugar', 'fiber', 'prot', 'salt'];
const NUTR_LABEL = { kcal: 'Energie', fat: 'Tuky', sat: 'z toho nasycené', carb: 'Sacharidy', sugar: 'z toho cukry', fiber: 'Vláknina', prot: 'Bílkoviny', salt: 'Sůl' };
/** Má surovina vyplněnou výživu (nebo ji někdo výslovně potvrdil jako ověřenou)? */
const hasNutri = (ing) => ing.check === true || ['kcal', 'fat', 'carb', 'prot', 'salt'].some((k) => num(ing[k]) > 0);

const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };

/** Hmotnost v gramech (ml se bere 1:1, kus podle hmotnosti kusu). */
function gramsOf(ing, qty) { return ing.base === 'ks' ? qty * num(ing.pieceG, 0) : qty; }

/** Plná kalkulace jedné receptury. Množství se násobí `scale`. */
function calcRecipe(r, ings) {
  const k = num(r.scale, 1) || 1;
  const byId = new Map(ings.map((i) => [i.id, i]));
  const lines = [];
  const alg = new Set();
  let material = 0, netG = 0, missing = 0;
  const N = Object.fromEntries(NUTR.map((k) => [k, 0]));
  let unverified = 0, noNutri = [];
  for (const it of r.items) {
    const ing = byId.get(it.ingId);
    if (!ing) { lines.push({ item: it, ing: null, net: 0, gross: 0, cost: 0, unit: '', missing: false }); if (it.ingId || num(it.qty) > 0) missing++; continue; }
    const net = num(it.qty) * k;
    const yieldPct = Math.min(100, Math.max(1, num(ing.yieldPct, 100)));
    const gross = net / (yieldPct / 100);
    const cost = ing.base === 'ks' ? gross * num(ing.price) : (gross / 1000) * num(ing.price);
    if (!(num(ing.price) > 0)) missing++;
    const g = gramsOf(ing, net);
    netG += g;
    for (const k of NUTR) N[k] += (g / 100) * num(ing[k]);
    if (net > 0) { if (ing.check !== true) unverified++; if (!hasNutri(ing)) noNutri.push(ing); }
    for (const a of ing.allergens || []) if (net > 0) alg.add(a);
    material += cost;
    lines.push({ item: it, ing, net, gross, cost, unit: BASE_UNIT[ing.base], missing: !(num(ing.price) > 0) });
  }
  const portions = Math.max(0.0001, num(r.portions, 1) * k);
  const labor = (num(r.laborMin) * k / 60) * num(r.hourly);
  const direct = material + labor;
  const overhead = direct * (num(r.overheadPct) / 100);
  const own = direct + overhead;
  const vat = num(r.vatPct, 12) / 100;
  const chosen = num(r.chosenPrice, 0); // zvolená prodejní cena za kus, s DPH
  let net_price, marginPct;
  if (chosen > 0) {
    net_price = (chosen / (1 + vat)) * portions;
    marginPct = net_price > 0 ? (1 - own / net_price) * 100 : 0;
  } else {
    marginPct = Math.min(95, Math.max(0, num(r.marginPct)));
    net_price = own / (1 - marginPct / 100);
  }
  const gross_price = net_price * (1 + vat);
  const finishedG = num(r.finishedG) > 0 ? num(r.finishedG) * k : netG;
  const per100 = finishedG > 0 ? 100 / finishedG : 0;
  const perPortion = 1 / portions;
  return {
    lines, material, labor, overhead, own, net_price, gross_price, vatAmount: gross_price - net_price, marginPct,
    portions, costPerPortion: own * perPortion, pricePerPortion: gross_price * perPortion,
    suggestedPerPortion: Math.ceil(gross_price * perPortion - 1e-9), netG, finishedG, missing,
    allergens: [...alg].sort((a, b) => a - b),
    nutri100: Object.fromEntries(NUTR.map((k) => [k, N[k] * per100])),
    nutriPortion: Object.fromEntries(NUTR.map((k) => [k, N[k] * perPortion])),
    unverified, noNutri,
  };
}

/** Kontrolní seznam: co ještě chybí, aby byla receptura hotová. act = akce tlačítka. */
function readiness(r, c) {
  const usable = r.items.filter((i) => i.ingId && num(i.qty) > 0).length;
  const noPriceLines = c.lines.filter((l) => l.ing && l.missing);
  const noPrice = noPriceLines.map((l) => l.ing.name);
  const noN = c.noNutri.map((i) => i.name);
  return [
    { key: 'items', ok: usable > 0, todo: 'Přidej do složení první suroviny', done: `Složení: ${usable} ${usable === 1 ? 'surovina' : usable < 5 ? 'suroviny' : 'surovin'}`, act: 'go', v: 'compose' },
    { key: 'price', ok: usable > 0 && c.missing === 0, todo: noPrice.length ? `Doplň cenu: ${noPrice.slice(0, 2).join(', ')}${noPrice.length > 2 ? ` a další (${noPrice.length - 2})` : ''}` : 'Vyber surovinu u všech řádků', done: 'Všechny suroviny mají cenu', act: noPrice.length ? 'fixprice' : 'go', v: 'compose', ingId: noPriceLines[0]?.ing.id },
    { key: 'nutri', ok: usable > 0 && noN.length === 0, todo: `Doplň výživové hodnoty: ${noN.slice(0, 2).join(', ')}${noN.length > 2 ? ` a další (${noN.length - 2})` : ''}`, done: 'Výživa je u všech surovin vyplněná', act: 'fixprice', v: 'compose', ingId: c.noNutri[0]?.id },
    { key: 'labor', ok: num(r.laborMin) > 0 && num(r.hourly) > 0, todo: 'Zadej, kolik práce receptura zabere', done: `Práce: ${num(r.laborMin)} min`, act: 'go', v: 'calc' },
    { key: 'steps', ok: String(r.steps || '').trim().length > 10, todo: 'Napiš technologický postup', done: 'Postup je vyplněný', act: 'go', v: 'steps' },
  ];
}

/** Faktor přepočtu podle formy: kruh (průměr) nebo obdélník (a × b). */
function formFactor(shape, from, to) {
  if (shape === 'circle') { const a = num(from.a), b = num(to.a); return a > 0 && b > 0 ? (b / a) ** 2 : 0; }
  const a1 = num(from.a) * num(from.b), a2 = num(to.a) * num(to.b);
  return a1 > 0 && a2 > 0 ? a2 / a1 : 0;
}

const UNITS = {
  g: ['mass', 1], dkg: ['mass', 10], kg: ['mass', 1000],
  ml: ['vol', 1], cl: ['vol', 10], dl: ['vol', 100], l: ['vol', 1000],
  'lžička (5 ml)': ['vol', 5], 'lžíce (15 ml)': ['vol', 15], 'hrnek (250 ml)': ['vol', 250],
};
function convertUnit(value, unit) {
  const [fam, f] = UNITS[unit] || [];
  if (!fam) return [];
  const base = num(value) * f;
  return Object.entries(UNITS).filter(([, v]) => v[0] === fam).map(([u, v]) => [u, base / v[1]]);
}

const vatSplit = (price, vatPct, withVat) => {
  const v = 1 + num(vatPct) / 100;
  return withVat ? { net: num(price) / v, gross: num(price) } : { net: num(price), gross: num(price) * v };
};
// =============================== LOGIC-END ===============================

// ------------------------------ katalog surovin ------------------------------
// Typické hodnoty na 100 g v pořadí NUTR (kcal, tuky, nasycené, sacharidy, cukry, vláknina, bílkoviny, sůl) podle běžných obalů
// a tabulek složení potravin. Ceny jsou orientační. U konkrétního výrobku vždy ověř údaje na obalu.
const C = (name, group, base, price, n, o = {}) => ({ name, group, base, price, pieceG: 0, yieldPct: 100, allergens: [], ...Object.fromEntries(NUTR.map((k, i) => [k, n[i]])), ...o });

const KEY = 'cukrarsky-sesit-v1';
let data = load();

if (!data.recipes.length) ui.rid = null; else ui.rid = data.recipes[0].id;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.ings) && Array.isArray(d.recipes)) return d; }
  } catch (e) { /* soukromé okno nebo zakázané úložiště: ukázková data zůstanou jen v paměti */ }
  return seedData();
}
function markSaved(ok) {
  const el = document.getElementById('saved'); if (!el) return;
  el.className = 'saved ' + (ok ? 'ok' : 'bad'); el.textContent = ok ? 'Uloženo ✓' : 'Neukládá se!';
  el.dataset.tip = ok ? 'Změny se ukládají automaticky v tomto prohlížeči' : 'Prohlížeč nepovoluje ukládání (soukromé okno?). Zálohuj ručně v záložce Záloha';
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); markSaved(true); } catch (e) { markSaved(false); /* bez úložiště stránka funguje dál */ } }
/** Snímek dat před mazáním, aby šlo smazané vrátit. */
function snap() { ui.undo = JSON.stringify(data); }
function doUndo() {
  if (!ui.undo) return;
  try { data = JSON.parse(ui.undo); } catch (e) { return; }
  ui.undo = null;
  if (!data.recipes.some((x) => x.id === ui.rid)) ui.rid = data.recipes[0]?.id ?? null;
  if (!data.ings.some((x) => x.id === ui.iid)) ui.iid = null;
  save(); render(); toast('Vráceno zpět');
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cz = (n, d = 2) => num(n).toLocaleString('cs-CZ', { minimumFractionDigits: d, maximumFractionDigits: d });
const kc = (n) => cz(n, 2) + ' Kč';
const curRecipe = () => data.recipes.find((r) => r.id === ui.rid) || null;
let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = esc(msg) + (undo ? ' <button type="button" class="toast-btn" data-act="undo">Vrátit zpět</button>' : '');
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), undo ? 9000 : 1800);
}
async function copy(text, ok = 'Zkopírováno') {
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand('copy'); } catch (e2) { /* nic */ }
    ta.remove(); toast(done ? ok : 'Kopírování se nepovedlo, označ text ručně');
  }
}

// ------------------------- dopočty bez překreslení -------------------------
function setOut(key, text) { document.querySelectorAll(`[data-out="${key}"]`).forEach((el) => (el.textContent = text)); }
function setHtml(key, html) { document.querySelectorAll(`[data-out="${key}"]`).forEach((el) => (el.innerHTML = html)); }
function refresh() {
  refreshValues();
  markNeeds();
  applyTips();
}
/** Jemně označí pole, která ještě čekají na vyplnění. */
function markNeeds() {
  const r = curRecipe();
  const mark = (sel, on) => document.querySelectorAll(sel).forEach((el) => el.classList.toggle('need', on));
  if (ui.tab === 'recipes' && r) {
    r.items.forEach((it, i) => {
      mark(`[data-if="ingId"][data-i="${i}"]`, !it.ingId);
      mark(`[data-if="qty"][data-i="${i}"]`, !!it.ingId && !(num(it.qty) > 0));
    });
    for (const k of ['laborMin', 'hourly', 'portions']) mark(`[data-rf="${k}"]`, !(num(r[k]) > 0));
    mark('[data-rf="steps"]', !String(r.steps || '').trim());
    mark('[data-rf="name"]', !String(r.name || '').trim());
  }
  const ing = ui.tab === 'ings' ? data.ings.find((x) => x.id === ui.iid) : null;
  if (ing) {
    mark('[data-gf="name"]', !String(ing.name || '').trim());
    mark('[data-gf="price"]', !(num(ing.price) > 0));
    mark('[data-gf="yieldPct"]', !(num(ing.yieldPct) > 0));
    mark('[data-gf="kcal"]', !hasNutri(ing));
  }
}
function refreshValues() {
  const r = curRecipe();
  if (ui.tab === 'recipes' && r) {
    const c = calcRecipe(r, data.ings);
    setOut('sum-material', kc(c.material)); setOut('sum-costpp', kc(c.costPerPortion)); setOut('sum-pricepp', kc(c.pricePerPortion)); setOut('sum-portions', cz(c.portions, c.portions % 1 ? 1 : 0) + ' ks');
    const rd = readiness(r, c);
    setHtml('checks', rd.map((x) => `<li class="${x.ok ? 'ok' : ''}"><button type="button" class="linkbtn" ${x.ok ? 'tabindex="-1"' : `data-act="${x.act}" data-v="${x.v}" data-ing="${x.ingId || ''}"`}><span class="tick">${x.ok ? '✓' : '○'}</span>${esc(x.ok ? x.done : x.todo)}</button></li>`).join(''));
    setHtml('sheet', sheetHtml(r, c));
    setOut('sb-name', r.name || 'Bez názvu'); setOut('sb-price', kc(c.pricePerPortion) + ' / ks');
    const STEP_KEYS = { compose: ['items', 'price'], calc: ['labor'], alg: ['nutri'], steps: ['steps'] };
    document.querySelectorAll('.step').forEach((el) => { const ok = STEP_KEYS[el.dataset.step].every((k) => rd.find((x) => x.key === k)?.ok); el.classList.toggle('done', ok); el.querySelector('.sn').textContent = ok ? '✓' : ['compose', 'calc', 'alg', 'steps'].indexOf(el.dataset.step) + 1; });
    document.querySelectorAll('[data-out="ready"]').forEach((el) => (el.hidden = !rd.every((x) => x.ok)));
    c.lines.forEach((l, i) => document.querySelectorAll(`[data-fix="${i}"]`).forEach((el) => (el.hidden = !(l.ing && l.missing))));
    c.lines.forEach((l, i) => {
      setOut(`net-${i}`, l.ing ? `${cz(l.net, l.net % 1 ? 1 : 0)} ${l.unit}` : '–');
      const y = l.ing ? num(l.ing.yieldPct, 100) : 100;
      setOut(`gross-${i}`, l.ing && y < 100 ? `po započtení ztrát (výtěžnost ${cz(y, 0)} %) nakoupit ${cz(l.gross, l.gross % 1 ? 1 : 0)} ${l.unit}` : '');
      setOut(`cost-${i}`, l.ing ? (l.missing ? 'chybí cena' : kc(l.cost)) : '–');
    });
    setOut('c-material', kc(c.material)); setOut('c-labor', kc(c.labor)); setOut('c-direct', kc(c.material + c.labor)); setOut('c-overhead', kc(c.overhead));
    setOut('c-own', kc(c.own)); setOut('c-profit', kc(c.net_price - c.own)); setOut('c-net', kc(c.net_price)); setOut('c-vat', kc(c.vatAmount)); setOut('c-gross', kc(c.gross_price));
    setOut('c-costpp', kc(c.costPerPortion)); setOut('c-pricepp', kc(c.pricePerPortion)); setOut('c-suggest', cz(c.suggestedPerPortion, 0) + ' Kč');
    setOut('c-margin-note', num(r.chosenPrice) > 0 ? `(při tvé ceně vychází ${cz(c.marginPct, 1)} %)` : '');
    setHtml('alg-chips', ALLERGENS.map(([n, short]) => `<div class="chip ${c.allergens.includes(n) ? 'on' : ''}"><b>${n}</b>${short}</div>`).join(''));
    setHtml('alg-text', c.allergens.length ? `<b>Alergeny:</b> ${c.allergens.map((n) => `<b>${ALLERGENS[n - 1][1]}</b> (${n})`).join(', ')}` : 'Podle vyplněných surovin neobsahuje žádný z 14 alergenů.');
    for (const [suffix, n] of [['100', c.nutri100], ['pp', c.nutriPortion]]) {
      setOut(`n-kj${suffix}`, cz(n.kcal * 4.184, 0) + ' kJ'); setOut(`n-kcal${suffix}`, cz(n.kcal, 0) + ' kcal');
      for (const k of ['fat', 'sat', 'carb', 'sugar', 'fiber', 'prot']) setOut(`n-${k}${suffix}`, cz(n[k], 1) + ' g');
      setOut(`n-salt${suffix}`, cz(n.salt, 2) + ' g');
    }
    const u = c.unverified, pl = u === 1 ? 'suroviny' : 'surovin';
    setOut('alg-note', u ? `Hodnoty u ${u} ${pl} jsou typické a neověřené. V ceníku je po kontrole podle obalu označ jako ověřené.` : 'Výživa vychází z ověřených surovin.');
  }
  if (ui.tab === 'tools' || ui.tab === 'recipes') {
    const fct = formFactor(ui.form.shape, ui.form.f, ui.form.t);
    setOut('form-factor', fct ? '× ' + cz(fct, 2) : '–');
    setOut('form-hint', fct ? (fct > 1 ? 'víc těsta' : fct < 1 ? 'míň těsta' : 'stejně') : 'doplň rozměry');
  }
  if (ui.tab === 'tools') {
    setHtml('conv-out', `<table class="mini-table">${convertUnit(ui.conv.v, ui.conv.u).map(([u, x]) => `<tr><td>${esc(u)}</td><td class="mono">${cz(x, x < 10 ? 2 : 1)}</td></tr>`).join('')}</table>`);
    const s = vatSplit(ui.vat.p, ui.vat.rate, ui.vat.with);
    setHtml('vat-out', `<table class="mini-table"><tr><td>Bez DPH</td><td class="mono">${kc(s.net)}</td></tr><tr><td>DPH ${cz(ui.vat.rate, 0)} %</td><td class="mono">${kc(s.gross - s.net)}</td></tr><tr><td><b>S DPH</b></td><td class="mono"><b>${kc(s.gross)}</b></td></tr></table>`);
  }
}

let palSel = 0, palItems = [];
function palAll() {

function renderPal(q) {
  const f = fold(q.trim());
  palItems = palAll().filter((x) => !f || fold(x.label).includes(f) || fold(x.kind).includes(f)).slice(0, 12);
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  $('#pall').innerHTML = palItems.map((x, n) => `<li data-pal="${n}" aria-selected="${n === palSel}"><b>${esc(x.label)}</b><small>${esc(x.kind)}</small></li>`).join('') || '<li style="cursor:default"><span class="muted">Nic nenalezeno</span></li>';
}
function openPalette() { palSel = 0; openModal(`<div class="pal"><input id="palq" class="in" placeholder="Hledej recepturu, surovinu nebo akci…" autocomplete="off" aria-label="Rychlé hledání"><ul id="pall" class="pal-list" role="listbox"></ul><p class="small muted" style="margin:10px 0 0">Šipky nahoru a dolů, Enter vybere, Esc zavře.</p></div>`); $('#palq').focus(); renderPal(''); }
function runPal(n) { const it = palItems[n]; if (!it) return; closeModal(); it.run(); }
document.addEventListener('input', (e) => { if (e.target.id === 'palq') { palSel = 0; renderPal(e.target.value); } });
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  const open = !$('#overlay').hidden;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open ? closeModal() : openPalette(); return; }
  if (e.key === 'Escape') { if (open) closeModal(); else if (tour) endTour(); return; }
  if (open && document.activeElement?.id === 'palq') {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); renderPal($('#palq').value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPal($('#palq').value); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); }
    return;
  }
  if (e.key === '?' && !typing && !open) { e.preventDefault(); openModal(shortcutsHtml()); }
});
$('#open-pal').addEventListener('click', openPalette);

let tipEl, tipTarget = null, tipTimer, tipAt = 0;
function ensureTip() { if (!tipEl) { tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); tipEl.hidden = true; document.body.appendChild(tipEl); } return tipEl; }
function hideTip() { clearTimeout(tipTimer); if (tipEl) tipEl.hidden = true; if (tipTarget) tipTarget.removeAttribute('aria-describedby'); tipTarget = null; }
function showTip(el) {
  const t = el.dataset.tip; if (!t) return;
  const box = ensureTip(); box.textContent = t; box.hidden = false; tipTarget = el; tipAt = Date.now(); el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  const x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  let y = r.bottom + 10; if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 10);
  box.style.left = x + 'px'; box.style.top = y + 'px';
}
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (el === tipTarget) return;
  hideTip();
  if (el) tipTimer = setTimeout(() => showTip(el), 320);
});
document.addEventListener('mouseleave', hideTip);
document.addEventListener('focusin', (e) => { const el = e.target.closest?.('[data-tip]'); hideTip(); if (el && !(el.matches('input,textarea') && el.matches(':not(.tipi)') && el.type === 'search')) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' || (tipTarget && tipTarget.matches('input,textarea') && e.key.length === 1)) hideTip(); }, true);
document.addEventListener('scroll', () => { if (tipEl && !tipEl.hidden && Date.now() - tipAt > 250) hideTip(); }, { passive: true, capture: true });
document.addEventListener('click', (e) => {
  const i = e.target.closest?.('.tipi');
  if (i) { e.preventDefault(); e.stopPropagation(); hideTip(); showTip(i); return; } // focus už mohl tooltip otevřít, klik ho jen potvrdí
  hideTip();
}, true);

function setTip(el, text) { if (el && text) el.dataset.tip = text; }
function applyTips() {
  const $$ = (sel) => document.querySelectorAll(sel);
  $$('[data-act="tab"]').forEach((el) => setTip(el, TIPS.tab[el.dataset.v]));
  $$('[data-act="sub"]').forEach((el) => setTip(el, TIPS.sub[el.dataset.v]));
  $$('[data-act="go"]').forEach((el) => setTip(el, TIPS.go[el.dataset.v]));
  $$('[data-act="scale"]').forEach((el) => setTip(el, TIPS.scale[el.dataset.v]));
  $$('[data-act]').forEach((el) => { if (!el.dataset.tip) setTip(el, TIPS.act[el.dataset.act]); });
  $$('.checks li button').forEach((el) => setTip(el, el.dataset.act ? 'Klikni a dostaneš se k místu, kde to opravíš' : 'Splněno'));
  $$('[data-rf]').forEach((el) => setTip(el, TIPS.rf[el.dataset.rf]));
  $$('[data-if]').forEach((el) => setTip(el, TIPS.if[el.dataset.if]));
  $$('[data-gf]').forEach((el) => setTip(el, TIPS.gf[el.dataset.gf]));
  $$('[data-form]').forEach((el) => setTip(el, TIPS.form[el.dataset.form]));
  $$('[data-conv]').forEach((el) => setTip(el, TIPS.conv[el.dataset.conv]));
  $$('[data-vat]').forEach((el) => setTip(el, TIPS.vat[el.dataset.vat]));
  $$('summary').forEach((el) => setTip(el, 'Spočítá, kolikrát víc nebo míň těsta potřebuješ, když použiješ jinou velikost formy'));
  $$('textarea[readonly]').forEach((el) => setTip(el, 'Celá záloha tvých dat. Zkopíruj ji tlačítkem pod polem'));
  $$('[data-cat]').forEach((el) => setTip(el, 'Doplní údaje podle katalogu. Můžeš je potom upravit'));
  $$('[data-chk]').forEach((el) => setTip(el.closest('label') || el, 'Zaškrtni, až hodnoty porovnáš s obalem konkrétního výrobku'));
  for (const [id, t] of Object.entries(TIPS.id)) setTip(document.getElementById(id), t);
  // řádky a bloky podle místa, kde se zobrazuje výpočet
  $$('[data-out]').forEach((el) => {
    const key = el.dataset.out, base = key.replace(/(100|pp)$/, '');
    const t = TIPS.out[key] || TIPS.out[base];
    if (!t) return;
    setTip(el.closest('tr') || el.closest('.figure') || el.closest('.sumbar > div') || el, t);
  });
  $$('.pill, .heads span, .mini-table th, .sumbar small, .figure .lab').forEach((el) => setTip(el, TIPS.text[el.textContent.trim().toLowerCase()] || TIPS.text[el.textContent.trim()]));
  $$('.alg .chip').forEach((el) => {
    const n = +(el.querySelector('b')?.textContent || 0); if (!n) return;
    setTip(el, `Alergen č. ${n}: ${ALLERGENS[n - 1][2]}. Například ${ALG_EX[n]}`);
  });
  $$('.rcard[data-act="open"]').forEach((el) => setTip(el, 'Otevře recepturu'));
  // ikonky "i" u pojmů, které potřebují víc než jeden řádek
  for (const [key, grp] of INFO) {
    const input = document.querySelector(`[data-${grp}="${key}"]`); if (!input) continue;
    const fld = input.closest('.field');
    const label = fld ? fld.querySelector(':scope > span') : input.closest('.param') || input.previousElementSibling;
    if (!label || label.querySelector('.tipi')) continue;
    const i = document.createElement('button'); i.type = 'button'; i.className = 'tipi'; i.textContent = 'i'; i.setAttribute('aria-label', 'Vysvětlení pojmu'); i.dataset.tip = TIPS[grp][key];
    label.appendChild(i);
  }
  $$('[title]').forEach((el) => { if (!el.dataset.tip) el.dataset.tip = el.title; el.removeAttribute('title'); });
}

      if (!d || !Array.isArray(d.ings) || !Array.isArray(d.recipes)) throw new Error('chybí suroviny nebo receptury');
      snap(); data = d; ui.rid = d.recipes[0]?.id ?? null; ui.iid = null; save(); ui.imp = ''; toast('Data načtena', true); ui.tab = 'recipes'; render();
    } catch (err) { setOut('imp-msg', 'Tohle nevypadá jako záloha: ' + err.message); }
  }
  else if (a === 'reset') {
    if (ui.armed !== 'reset') { ui.armed = 'reset'; render(); return; }
    snap(); data = seedData(); ui.rid = data.recipes[0].id; ui.iid = null; ui.armed = null; save(); ui.tab = 'recipes'; render(); toast('Ukázková data obnovena', true);
  }
});
const THEME_KEY = 'cukrarsky-sesit-theme';
try { const saved = localStorage.getItem(THEME_KEY); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) { /* bez úložiště se řídí systémem */ }
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* jen pro tuto návštěvu */ }
});
render();
</script>
</body>
</html>
